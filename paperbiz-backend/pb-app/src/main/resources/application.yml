# PaperBiz backend configuration. Secrets come from environment variables, never from this file.
server:
  port: ${PB_SERVER_PORT:8080}

spring:
  application:
    name: paperbiz

dataman:
  db:
    url: ${DM_DB_URL:}                       # e.g. jdbc:sqlserver://host:1433;encrypt=true;trustServerCertificate=true
    username: ${DM_DB_USER:}
    password: ${DM_DB_PASSWORD:}
    default-catalog: ${DM_DB_DEFAULT_CATALOG:}
    maximum-pool-size: ${DM_DB_POOL_MAX:20}
    minimum-idle: ${DM_DB_POOL_MIN:2}
  mongo:
    host: ${DM_MONGO_HOST:}
    port: ${DM_MONGO_PORT:27017}
    username: ${DM_MONGO_USER:}
    password: ${DM_MONGO_PASSWORD:}
    auth-source: ${DM_MONGO_AUTH_SOURCE:admin}
  locale:
    country: ${DM_LOCALE_COUNTRY:IND}        # IND | KHM | USA | KHM-USA
  auth:
    jwt-secret: ${DM_AUTH_JWT_SECRET:}       # required, at least 32 characters (unless dev-headers)
    token-minutes: ${DM_AUTH_TOKEN_MINUTES:480}
    dev-headers: ${DM_AUTH_DEV_HEADERS:false} # true = X-Dm-* headers instead of tokens (development only)
    max-failures: ${DM_AUTH_MAX_FAILURES:5}
    lock-minutes: ${DM_AUTH_LOCK_MINUTES:15}
  reports:
    dir: ${DM_REPORTS_DIR:reports}
    fonts-dir: ${DM_REPORTS_FONTS_DIR:}
    template-cache: ${DM_REPORTS_TEMPLATE_CACHE:true}
  cors:
    allowed-origins: ${DM_CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
